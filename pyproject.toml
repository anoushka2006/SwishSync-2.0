[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swishsync-cv"
version = "0.1.0"
description = "Foundational basketball computer vision pipeline for SwishSync."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "ultralytics",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
swishsync-cv = "swishsync_cv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
